<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1E6;
    --bg-panel: #FCFAF4;
    --bg-sidebar: #EFE7D3;
    --bg-hover: #E6DCC4;
    --navy: #1C2C4C;
    --navy-deep: #101A31;
    --navy-soft: #33456B;
    --accent: #8C6A34;
    --accent-soft: #B99A5D;
    --text-primary: #1C2C4C;
    --text-secondary: #57628A;
    --text-muted: #8791AE;
    --on-navy: #F3EFE3;
    --border: #DDD1AF;
    --border-strong: #C6B489;
    --success: #3E6B4F;
    --danger: #9A4C3E;
    --radius: 4px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101827;
      --bg-panel: #17213A;
      --bg-sidebar: #0C1220;
      --bg-hover: #202C4A;
      --navy: #AEC0E8;
      --navy-deep: #EDEAE0;
      --navy-soft: #8FA4D6;
      --accent: #D8B978;
      --accent-soft: #B99A5D;
      --text-primary: #EDEAE0;
      --text-secondary: #AEB6CE;
      --text-muted: #7C87A6;
      --on-navy: #101827;
      --border: #2A3654;
      --border-strong: #3C4A72;
      --success: #7FBE97;
      --danger: #D98D7C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101827;
    --bg-panel: #17213A;
    --bg-sidebar: #0C1220;
    --bg-hover: #202C4A;
    --navy: #AEC0E8;
    --navy-deep: #EDEAE0;
    --navy-soft: #8FA4D6;
    --accent: #D8B978;
    --accent-soft: #B99A5D;
    --text-primary: #EDEAE0;
    --text-secondary: #AEB6CE;
    --text-muted: #7C87A6;
    --on-navy: #101827;
    --border: #2A3654;
    --border-strong: #3C4A72;
    --success: #7FBE97;
    --danger: #D98D7C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  textarea { font-family: inherit; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Mobile top bar ---------- */
  .mobile-bar {
    display: none;
    position: sticky; top: 0; z-index: 40;
    align-items: center; gap: .9rem;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    padding: .85rem 1.1rem;
  }
  .mobile-bar .brand { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .menu-btn {
    background: none; border: 1px solid var(--border-strong); border-radius: var(--radius);
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
  }
  .menu-btn svg { width: 18px; height: 18px; }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(16,24,39,.45); z-index: 45;
  }
  .overlay.show { display: block; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 1.8rem 1.1rem 3rem;
    overflow-y: auto;
  }
  .sidebar-brand {
    font-family: var(--font-display); font-weight: 600; font-size: 1.4rem;
    color: var(--navy); margin: 0 .3rem 1.6rem;
    letter-spacing: .01em;
  }
  .nav-tree { list-style: none; margin: 0; padding: 0; }
  .nav-node { margin: 0; }
  .nav-row {
    display: flex; align-items: center; gap: .5rem;
    width: 100%; text-align: left; background: none; border: none;
    padding: .5rem .6rem; border-radius: var(--radius);
    font-size: .92rem; color: var(--text-secondary);
    line-height: 1.35;
  }
  .nav-row:hover { background: var(--bg-hover); color: var(--text-primary); }
  .nav-row.active { background: var(--navy); color: var(--on-navy); font-weight: 500; }
  .nav-row .chev {
    width: 14px; height: 14px; flex-shrink: 0; transition: transform .15s ease;
    color: var(--text-muted);
  }
  .nav-row.active .chev { color: var(--on-navy); }
  .nav-node.open > .nav-row .chev { transform: rotate(90deg); }
  .nav-row .ext {
    width: 12px; height: 12px; flex-shrink: 0; margin-left: auto; opacity: .55;
  }
  .nav-children {
    list-style: none; margin: 0; padding: 0 0 0 .55rem;
    border-left: 1px solid var(--border-strong);
    margin-left: .65rem;
  }
  .nav-children[hidden] { display: none; }
  .depth-1 > .nav-row { padding-left: .6rem; }
  .depth-2 > .nav-row { padding-left: .5rem; font-size: .89rem; }
  .depth-3 > .nav-row { padding-left: .5rem; font-size: .87rem; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 3rem 3.5rem 5rem; overflow-y: auto; }
  .crumb { font-size: .8rem; color: var(--text-muted); margin-bottom: .6rem; }
  .page-title {
    font-family: var(--font-display); font-weight: 600; font-size: 2rem;
    color: var(--text-primary); margin: 0 0 .75rem; max-width: 34ch;
  }
  .page-desc {
    color: var(--text-secondary); font-size: 1.02rem; line-height: 1.65;
    max-width: 62ch; margin: 0 0 2rem;
  }

  /* ---------- Home / hero ---------- */
  .hero { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hero-eyebrow { color: var(--accent); font-size: .95rem; margin: 0 0 .4rem; }
  .hero-title {
    font-family: var(--font-display); font-weight: 600; font-size: 2.6rem;
    line-height: 1.12; max-width: 18ch; margin: 0 0 1rem;
  }
  .hero-sub { color: var(--text-secondary); font-size: 1.08rem; max-width: 56ch; line-height: 1.65; margin: 0 0 2.6rem; }

  .ladder-wrap { margin: 0 0 3rem; }
  .ladder-heading { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 0 0 .3rem; }
  .ladder-hint { color: var(--text-muted); font-size: .85rem; margin: 0 0 1.6rem; }
  .ladder { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); }
  .ladder::before {
    content: ''; position: absolute; top: 21px; left: calc(100% / 12); right: calc(100% / 12);
    height: 2px; background: var(--border-strong); z-index: 0;
  }
  .ladder-item { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: .55rem; }
  .ladder-dot {
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--border-strong);
    background: var(--bg-panel); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: .95rem; color: var(--text-secondary);
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .ladder-item.done .ladder-dot { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .ladder-item.current .ladder-dot { border-color: var(--accent); border-width: 3px; }
  .ladder-label {
    background: none; border: none; padding: 0; font-size: .82rem; color: var(--text-secondary);
    text-align: center; max-width: 92px; line-height: 1.3;
  }
  .ladder-label:hover { color: var(--navy); text-decoration: underline; }
  .ladder-item.current .ladder-label { color: var(--text-primary); font-weight: 500; }

  @media (max-width: 720px) {
    .ladder { grid-template-columns: 1fr; gap: 1.3rem; }
    .ladder::before { left: 21px; right: auto; top: 21px; bottom: 21px; width: 2px; height: auto; }
    .ladder-item { flex-direction: row; align-items: center; justify-content: flex-start; gap: .9rem; }
    .ladder-label { text-align: left; max-width: none; }
  }

  .home-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }

  /* ---------- Cards (overview grids) ---------- */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
  .node-card {
    text-align: left; background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 3px solid var(--navy); border-radius: 0 var(--radius) var(--radius) 0;
    padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .4rem;
  }
  .node-card:hover { border-left-color: var(--accent); }
  .node-card .n-title { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
  .node-card .n-desc { font-size: .87rem; color: var(--text-secondary); line-height: 1.5; }

  /* ---------- Link card ---------- */
  .link-card {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--bg-panel); border: 1px solid var(--border);
    padding: 1.1rem 1.3rem; border-radius: var(--radius); margin-bottom: 2rem; max-width: 46rem;
  }
  .link-card-text .lc-label { font-size: .78rem; color: var(--text-muted); margin-bottom: .15rem; }
  .link-card-text .lc-url { font-size: .88rem; color: var(--text-secondary); word-break: break-all; }
  .btn-open {
    display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap;
    background: var(--navy); color: var(--on-navy); border: none;
    padding: .6rem 1.1rem; border-radius: var(--radius); font-size: .88rem; font-weight: 500;
    text-decoration: none; flex-shrink: 0;
  }
  .btn-open svg { width: 14px; height: 14px; }
  .btn-open:hover { background: var(--navy-soft); }

  /* ---------- Checklist ---------- */
  .section-block { max-width: 46rem; margin-bottom: 2.4rem; }
  .section-label {
    font-size: .78rem; color: var(--text-muted); text-transform: none;
    margin: 0 0 .8rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem;
  }
  .checklist { list-style: none; margin: 0 0 .9rem; padding: 0; }
  .check-row { display: flex; align-items: flex-start; gap: .7rem; padding: .5rem .2rem; border-bottom: 1px solid var(--border); }
  .check-row input[type="checkbox"] { margin-top: .2rem; width: 16px; height: 16px; accent-color: var(--navy); flex-shrink: 0; }
  .check-row label { font-size: .93rem; line-height: 1.45; flex: 1; }
  .check-row.done label { color: var(--text-muted); text-decoration: line-through; }
  .check-row .del-btn {
    background: none; border: none; color: var(--text-muted); font-size: .78rem; padding: .1rem .3rem;
    flex-shrink: 0; visibility: hidden;
  }
  .check-row:hover .del-btn { visibility: visible; }
  .add-row { display: flex; gap: .6rem; margin-top: .4rem; }
  .add-row input {
    flex: 1; border: 1px solid var(--border-strong); background: var(--bg-panel); color: var(--text-primary);
    border-radius: var(--radius); padding: .55rem .8rem; font-size: .9rem;
  }
  .add-row input:focus { outline: 2px solid var(--navy-soft); outline-offset: 1px; }
  .add-row button {
    border: 1px solid var(--navy); background: transparent; color: var(--navy);
    border-radius: var(--radius); padding: .55rem 1rem; font-size: .85rem; font-weight: 500;
  }
  .add-row button:hover { background: var(--navy); color: var(--on-navy); }

  /* ---------- Notes ---------- */
  .notes-area {
    width: 100%; min-height: 130px; resize: vertical;
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: .9rem 1rem; font-size: .93rem; color: var(--text-primary); line-height: 1.6;
  }
  .notes-area:focus { outline: 2px solid var(--navy-soft); outline-offset: 1px; }
  .save-hint { font-size: .76rem; color: var(--text-muted); margin-top: .4rem; min-height: 1em; }

  /* ---------- Livros ---------- */
  .book-form { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .book-form input[type="text"] {
    flex: 1; min-width: 180px; border: 1px solid var(--border-strong); background: var(--bg-panel);
    color: var(--text-primary); border-radius: var(--radius); padding: .6rem .85rem; font-size: .9rem;
  }
  .book-form select {
    border: 1px solid var(--border-strong); background: var(--bg-panel); color: var(--text-primary);
    border-radius: var(--radius); padding: .6rem .7rem; font-size: .87rem;
  }
  .book-form button {
    border: none; background: var(--navy); color: var(--on-navy); border-radius: var(--radius);
    padding: .6rem 1.1rem; font-size: .87rem; font-weight: 500;
  }
  .book-form button:hover { background: var(--navy-soft); }
  .book-list { list-style: none; margin: 0; padding: 0; max-width: 46rem; }
  .book-row {
    display: flex; align-items: center; gap: .9rem; padding: .75rem .2rem; border-bottom: 1px solid var(--border);
  }
  .book-row .b-title { flex: 1; font-size: .95rem; }
  .book-row select {
    border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-secondary);
    border-radius: var(--radius); padding: .3rem .5rem; font-size: .8rem;
  }
  .book-row .del-btn { background: none; border: none; color: var(--text-muted); font-size: .78rem; }
  .book-row .del-btn:hover { color: var(--danger); }
  .empty-hint { color: var(--text-muted); font-size: .88rem; padding: .8rem 0; }

  .error-text { color: var(--danger); font-size: .78rem; margin-top: .3rem; min-height: 1em; }

  /* ---------- Vídeos ---------- */
  .video-add-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .video-add-row input {
    flex: 1; min-width: 160px; border: 1px solid var(--border-strong); background: var(--bg-panel);
    color: var(--text-primary); border-radius: var(--radius); padding: .55rem .8rem; font-size: .9rem;
  }
  .video-add-row button {
    border: 1px solid var(--navy); background: transparent; color: var(--navy);
    border-radius: var(--radius); padding: .55rem 1rem; font-size: .85rem; font-weight: 500;
  }
  .video-add-row button:hover { background: var(--navy); color: var(--on-navy); }
  .video-item { margin-bottom: 1.2rem; }
  .video-item-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .5rem; }
  .video-item-title { font-size: .9rem; font-weight: 500; }
  .video-embed-wrap {
    position: relative; width: 100%; padding-top: 56.25%;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .video-embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .video-open-link { display: inline-block; font-size: .82rem; color: var(--navy-soft); margin-top: .4rem; }
  .video-open-link:hover { text-decoration: underline; }
  .video-no-embed {
    display: flex; align-items: center; gap: .6rem; padding: 1rem 1.1rem; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: var(--radius); font-size: .88rem; color: var(--text-secondary);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 900px) {
    .mobile-bar { display: flex; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: -320px; z-index: 46;
      transition: left .2s ease; box-shadow: 2px 0 18px rgba(0,0,0,.15);
    }
    .sidebar.open { left: 0; }
    .main { padding: 1.5rem 1.25rem 3.5rem; }
    .hero-title { font-size: 2rem; }
    .page-title { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<h1 class="sr-only">Carreira: painel pessoal de gestão de carreira, com trilha de evolução profissional, base de conhecimento e ferramentas de acompanhamento</h1>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Carreira</div>
    <ul class="nav-tree" id="navTree"></ul>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <div class="mobile-bar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="brand">Carreira</span>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  var NAV = [
    { id: "carreira", label: "Carreira", type: "group", children: [
      { id: "estagio-conseguir", label: "Como Conseguir um Estágio", type: "page" },

        { id: "estagiario-n1", label: "Estagiário Nível Um", type: "page" },
        { id: "estagiario-n2", label: "Estagiário Nível Dois", type: "page" },
        { id: "estagiario-n3", label: "Estagiário Nível Três", type: "page" }
      ]},
      { id: "habilidades", label: "Habilidades e conhecimentos", type: "group", children: [
        { id: "eng-dados", label: "Engenharia de Dados", type: "page" },
        { id: "networking", label: "Networking", type: "page" },
        { id: "algoritmos", label: "Algoritmos", type: "page" },
        { id: "oratoria", label: "Oratória", type: "page" },
        { id: "vender", label: "Como se Vender", type: "page" },
        { id: "sites-docs", label: "Sites e Documentações", type: "page" }
      ]},
      { id: "jr-pleno", label: "Como Sair de JR para Pleno", type: "page" },

        { id: "devdocs", label: "Documentão de Tecnologias", type: "page" }

  var CONTENT = {
    "carreira": { desc: "Sua trilha de evolução dentro da área de dados: do primeiro estágio até a sênioridade, junto com as competências que sustentam cada etapa." },
    "estagio-conseguir": {

      notes: true
    },
    "estagiario-n2": {

  var STAGES = [
    { id: "n1", label: "Estágio N1", target: "estagiario-n1" },
    { id: "n2", label: "Estágio N2", target: "estagiario-n2" },

    { id: "senior", label: "Sênior", target: "senior" }
  ];

  var nodeIndex = {};
  var parentIndex = {};
  (function indexNav(list, parent) {
    list.forEach(function (n) {
      nodeIndex[n.id] = n;
      parentIndex[n.id] = parent;
      if (n.children) indexNav(n.children, n);
    });
  })(NAV, null);

  var expanded = {};
  var currentId = null;

  function storageGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  var ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  /* ---------------- Sidebar ---------------- */
  function buildTree(list, depth) {
    var ul = el("ul", { class: depth === 0 ? "nav-tree" : "nav-children" });
    if (depth > 0) ul.id = "children-auto";
    list.forEach(function (node) {
      var li = el("li", { class: "nav-node depth-" + (depth + 1) });
      var isGroup = node.type === "group";
      var isOpen = !!expanded[node.id];
      if (isGroup && isOpen) li.classList.add("open");

      var rowChildren = [];
      if (isGroup) {
        rowChildren.push(el("span", { class: "chev", html: ICON_CHEV }));
      } else {
        rowChildren.push(el("span", { class: "chev", html: "" }));
      }
      rowChildren.push(el("span", { text: node.label }));
      if (CONTENT[node.id] && CONTENT[node.id].link) {
        rowChildren.push(el("span", { class: "ext", html: ICON_EXT }));
      }
      var row = el("button", { class: "nav-row" + (node.id === currentId ? " active" : ""), "data-id": node.id }, rowChildren);
      row.addEventListener("click", function () {
        if (isGroup) {
          expanded[node.id] = !expanded[node.id];
        }
        selectNode(node.id);
      });
      li.appendChild(row);

      if (isGroup) {
        var childUl = buildTree(node.children, depth + 1);
        if (!isOpen) childUl.setAttribute("hidden", "");
        li.appendChild(childUl);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  function renderSidebar() {
    var host = document.getElementById("navTree");
    host.innerHTML = "";
    host.appendChild(buildTree(NAV, 0));
  }

  function expandAncestors(id) {
    var p = parentIndex[id];
    while (p) { expanded[p.id] = true; p = parentIndex[p.id]; }
  }

  /* ---------------- Content builders ---------------- */
  function crumbFor(id) {
    var chain = [];
    var n = nodeIndex[id];
    while (n) { chain.unshift(n.label); n = parentIndex[n.id]; }
    return chain.join(" / ");
  }

  function buildChecklist(id, items) {
    var wrap = el("div", { class: "section-block" });
    wrap.appendChild(el("div", { class: "section-label", text: "Checklist" }));
    var checkedKey = "carreira_check_" + id;
    var customKey = "carreira_check_custom_" + id;
    var checkedMap = storageGet(checkedKey, {});
    var custom = storageGet(customKey, []);
    var all = items.concat(custom);

    var ul = el("ul", { class: "checklist" });
    function renderRows() {
      ul.innerHTML = "";
      all.forEach(function (text, idx) {
        var isDone = !!checkedMap[text];
        var cb = el("input", { type: "checkbox" });
        cb.checked = isDone;
        var cbId = "cb-" + id + "-" + idx;
        cb.id = cbId;
        var label = el("label", { text: text });
        label.setAttribute("for", cbId);
        var row = el("li", { class: "check-row" + (isDone ? " done" : "") }, [cb, label]);
        var isCustom = idx >= items.length;
        if (isCustom) {
          var del = el("button", { class: "del-btn", type: "button", text: "Remover" });
          del.addEventListener("click", function () {
            var ci = idx - items.length;
            custom.splice(ci, 1);
            delete checkedMap[text];
            storageSet(customKey, custom);
            storageSet(checkedKey, checkedMap);
            all = items.concat(custom);
            renderRows();
          });
          row.appendChild(del);
        }
        cb.addEventListener("change", function () {
          checkedMap[text] = cb.checked;
          storageSet(checkedKey, checkedMap);
          row.classList.toggle("done", cb.checked);
        });
        ul.appendChild(row);
      });
    }
    renderRows();
    wrap.appendChild(ul);

    var addRow = el("div", { class: "add-row" });
    var input = el("input", { type: "text", placeholder: "Adicionar item personalizado" });
    var errorText = el("div", { class: "error-text" });
    var addBtn = el("button", { type: "button", text: "Adicionar" });
    addBtn.addEventListener("click", function () {
      var val = input.value.trim();
      if (!val) {
        errorText.textContent = "Escreva um item antes de adicionar.";
        return;
      }
      errorText.textContent = "";
      custom.push(val);
      storageSet(customKey, custom);
      all = items.concat(custom);
      input.value = "";
      renderRows();
    });
    input.addEventListener("input", function () { if (input.value.trim()) errorText.textContent = ""; });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addBtn.click(); } });
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    wrap.appendChild(addRow);
    wrap.appendChild(errorText);
    return wrap;
  }

  function buildNotes(id) {
    var wrap = el("div", { class: "section-block" });
    wrap.appendChild(el("div", { class: "section-label", text: "Minhas anotações" }));
    var key = "carreira_notes_" + id;
    var ta = el("textarea", { class: "notes-area", placeholder: "Escreva aqui suas observações sobre este tópico..." });
    ta.value = storageGet(key, "");
    var hint = el("div", { class: "save-hint", text: "" });
    var timer = null;
    ta.addEventListener("input", function () {
      hint.textContent = "";
      clearTimeout(timer);
      timer = setTimeout(function () {
        storageSet(key, ta.value);
        hint.textContent = "Salvo neste navegador";
      }, 400);
    });
    wrap.appendChild(ta);
    wrap.appendChild(hint);
    return wrap;
  }

  function parseVideoEmbed(url) {
    var yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/);
    if (yt) return "https://www.youtube.com/embed/" + yt[1];
    var vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vm) return "https://player.vimeo.com/video/" + vm[1];
    return null;
  }

  function buildEmbeddedVideoItem(v) {
    var item = el("div", { class: "video-item" });
    item.appendChild(el("div", { class: "video-item-head" }, [
      el("span", { class: "video-item-title", text: v.titulo || "Vídeo" })
    ]));
    var video = document.createElement("video");
    video.controls = true;
    video.style.width = "100%";
    video.style.borderRadius = "var(--radius)";
    video.style.background = "#000";
    video.setAttribute("preload", "metadata");
    var source = document.createElement("source");
    source.src = v.src;
    source.type = "video/mp4";
    video.appendChild(source);
    item.appendChild(video);
    return item;
  }

  function buildVideos(id, embeddedVideos) {
    var wrap = el("div", { class: "section-block" });
    wrap.appendChild(el("div", { class: "section-label", text: "Vídeos" }));
    (embeddedVideos || []).forEach(function (v) { wrap.appendChild(buildEmbeddedVideoItem(v)); });
    var key = "carreira_videos_" + id;
    var videos = storageGet(key, []);

    var list = el("div", {});
    function renderList() {
      list.innerHTML = "";
      videos.forEach(function (v, idx) {
        var item = el("div", { class: "video-item" });
        var head = el("div", { class: "video-item-head" }, [
          el("span", { class: "video-item-title", text: v.titulo || "Vídeo " + (idx + 1) })
        ]);
        var del = el("button", { class: "del-btn", type: "button", text: "Remover" });
        del.style.visibility = "visible";
        del.addEventListener("click", function () {
          videos.splice(idx, 1);
          storageSet(key, videos);
          renderList();
        });
        head.appendChild(del);
        item.appendChild(head);

        var embedSrc = parseVideoEmbed(v.url);
        if (embedSrc) {
          var embedWrap = el("div", { class: "video-embed-wrap" });
          var iframe = document.createElement("iframe");
          iframe.src = embedSrc;
          iframe.setAttribute("allowfullscreen", "");
          iframe.setAttribute("title", v.titulo || "Vídeo");
          embedWrap.appendChild(iframe);
          item.appendChild(embedWrap);
        } else {
          item.appendChild(el("div", { class: "video-no-embed", text: "Não foi possível identificar uma prévia para este link." }));
        }
        var openLink = el("a", { class: "video-open-link", href: v.url, target: "_blank", rel: "noopener noreferrer", text: "Abrir vídeo em outra aba" });
        item.appendChild(openLink);
        list.appendChild(item);
      });
    }
    renderList();
    wrap.appendChild(list);

    var addRow = el("div", { class: "video-add-row" });
    var titleInput = el("input", { type: "text", placeholder: "Título (opcional)" });
    var urlInput = el("input", { type: "text", placeholder: "Link do vídeo (YouTube, Vimeo...)" });
    var errorText = el("div", { class: "error-text" });
    var addBtn = el("button", { type: "button", text: "Adicionar vídeo" });
    addBtn.addEventListener("click", function () {
      var url = urlInput.value.trim();
      if (!url) {
        errorText.textContent = "Cole o link do vídeo antes de adicionar.";
        return;
      }
      errorText.textContent = "";
      videos.push({ titulo: titleInput.value.trim(), url: url });
      storageSet(key, videos);
      titleInput.value = "";
      urlInput.value = "";
      renderList();
    });
    urlInput.addEventListener("input", function () { if (urlInput.value.trim()) errorText.textContent = ""; });
    urlInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addBtn.click(); } });
    addRow.appendChild(titleInput);
    addRow.appendChild(urlInput);
    addRow.appendChild(addBtn);
    wrap.appendChild(addRow);
    wrap.appendChild(errorText);
    return wrap;
  }

  function buildLinkCard(url) {
    var card = el("div", { class: "link-card" });
    var text = el("div", { class: "link-card-text" }, [
      el("div", { class: "lc-label", text: "Página relacionada" }),
      el("div", { class: "lc-url", text: url })
    ]);
    var btn = el("a", { class: "btn-open", href: url, target: "_blank", rel: "noopener noreferrer" }, [
      el("span", { text: "Abrir" }),
      el("span", { html: ICON_EXT })
    ]);
    card.appendChild(text);
    card.appendChild(btn);
    return card;
  }

  function buildBookshelf() {
    var wrap = el("div", { class: "section-block" });
    var key = "carreira_livros";
    var books = storageGet(key, []);

    var form = el("div", { class: "book-form" });
    var titleInput = el("input", { type: "text", placeholder: "Título do livro" });
    var statusSelect = el("select", {}, [
      el("option", { value: "quero", text: "Quero ler" }),
      el("option", { value: "lendo", text: "Lendo" }),
      el("option", { value: "lido", text: "Lido" })
    ]);
    var addBtn = el("button", { type: "button", text: "Adicionar" });
    var errorText = el("div", { class: "error-text" });

    var list = el("ul", { class: "book-list" });

    function renderList() {
      list.innerHTML = "";
      if (books.length === 0) {
        list.appendChild(el("li", { class: "empty-hint", text: "Nenhum livro adicionado ainda." }));
        return;
      }
      books.forEach(function (book, idx) {
        var sel = el("select", {}, [
          el("option", { value: "quero", text: "Quero ler" }),
          el("option", { value: "lendo", text: "Lendo" }),
          el("option", { value: "lido", text: "Lido" })
        ]);
        sel.value = book.status;
        sel.addEventListener("change", function () {
          books[idx].status = sel.value;
          storageSet(key, books);
        });
        var del = el("button", { class: "del-btn", type: "button", text: "Remover" });
        del.addEventListener("click", function () {
          books.splice(idx, 1);
          storageSet(key, books);
          renderList();
        });
        var row = el("li", { class: "book-row" }, [
          el("span", { class: "b-title", text: book.titulo }),
          sel,
          del
        ]);
        list.appendChild(row);
      });
    }
    renderList();

    addBtn.addEventListener("click", function () {
      var val = titleInput.value.trim();
      if (!val) {
        errorText.textContent = "Escreva o título do livro antes de adicionar.";
        return;
      }
      errorText.textContent = "";
      books.push({ titulo: val, status: statusSelect.value });
      storageSet(key, books);
      titleInput.value = "";
      renderList();
    });
    titleInput.addEventListener("input", function () { if (titleInput.value.trim()) errorText.textContent = ""; });
    titleInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addBtn.click(); } });

    form.appendChild(titleInput);
    form.appendChild(statusSelect);

    wrap.appendChild(form);

  function buildOverviewGrid(node) {
    var grid = el("div", { class: "card-grid" });
    node.children.forEach(function (child) {
      var c = CONTENT[child.id] || {};
      var card = el("button", { class: "node-card", type: "button" }, [
        el("div", { class: "n-title", text: child.label }),
        el("div", { class: "n-desc", text: c.desc || "" })
      ]);
      card.addEventListener("click", function () {
        if (child.type === "group") expanded[child.id] = true;
        expandAncestors(child.id);
        selectNode(child.id);
      });
      grid.appendChild(card);
    });
    return grid;
  }

    var main = document.getElementById("main");
    main.innerHTML = "";
    var hero = el("div", { class: "hero" });
    hero.appendChild(el("p", { class: "hero-eyebrow", text: "Painel pessoal" }));
    hero.appendChild(el("h2", { class: "hero-title", text: "Sua carreira, com direção clara" }));
    hero.appendChild(el("p", { class: "hero-sub", text: "Acompanhe onde você está na trilha de dados, organize seu plano de desenvolvimento e reúna, num só lugar, as referências que sustentam cada etapa." }));

    var ladderWrap = el("div", { class: "ladder-wrap" });
    ladderWrap.appendChild(el("div", { class: "ladder-heading", text: "Trilha de carreira" }));
    ladderWrap.appendChild(el("div", { class: "ladder-hint", text: "Clique no círculo para marcar onde você está agora. Clique no nome para abrir o conteúdo da etapa." }));
    var ladder = el("div", { class: "ladder" });
    var curIdx = currentStageIndex();
    STAGES.forEach(function (stage, i) {
      var item = el("div", { class: "ladder-item" });

      if (i === curIdx) item.classList.add("current");
      var dot = el("button", { type: "button", class: "ladder-dot", text: String(i + 1), "aria-label": "Marcar " + stage.label + " como etapa atual" });
      dot.addEventListener("click", function () {
        setCurrentStageIndex(i === curIdx ? -1 : i);
        renderHome();
      });
      var labelBtn = el("button", { type: "button", class: "ladder-label", text: stage.label });
      labelBtn.addEventListener("click", function () {
        expandAncestors(stage.target);
        selectNode(stage.target);
      });
      item.appendChild(dot);
      item.appendChild(labelBtn);
      ladder.appendChild(item);
    });
    ladderWrap.appendChild(ladder);

      grid.appendChild(card);

  /* ---------------- Page render ---------------- */
  function renderContent(id) {
    var main = document.getElementById("main");
    main.innerHTML = "";
    currentId = id;

    if (id === "home") { renderHome(); return; }

    var node = nodeIndex[id];
    var content = CONTENT[id] || {};
    var label = node ? node.label : (id === "senior" ? "Sênior" : id);

    if (node) main.appendChild(el("div", { class: "crumb", text: crumbFor(id) }));
    main.appendChild(el("h2", { class: "page-title", text: label }));
    if (content.desc) main.appendChild(el("p", { class: "page-desc", text: content.desc }));

    if (content.link) main.appendChild(buildLinkCard(content.link));
    if (content.bookshelf) main.appendChild(buildBookshelf());
    if (content.checklist) main.appendChild(buildChecklist(id, content.checklist));
    if (node && node.type === "group") main.appendChild(buildOverviewGrid(node));
    if (content.notes) main.appendChild(buildVideos(id, content.embeddedVideos));
    if (content.notes) main.appendChild(buildNotes(id));

    main.scrollTop = 0;
  }

  function selectNode(id) {
    renderSidebar();
    renderContent(id);
    closeMobileSidebar();
  }

  /* ---------------- Mobile sidebar ---------------- */
  function openMobileSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("show");
  }
  function closeMobileSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
  document.getElementById("menuBtn").addEventListener("click", openMobileSidebar);
  document.getElementById("overlay").addEventListener("click", closeMobileSidebar);

  document.getElementById("sidebar").querySelector(".sidebar-brand").addEventListener("click", function () {
    selectNode("home");
  });
  document.getElementById("sidebar").querySelector(".sidebar-brand").style.cursor = "pointer";

  /* ---------------- Init ---------------- */
  renderSidebar();
  renderContent("home");
})();
</script>
</body>
</html>
